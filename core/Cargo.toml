[package]
name = "dim-creator-core"
version.workspace = true
edition = "2024"
rust-version = "1.93"
license.workspace = true

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=9.4.1", default-features = false, features = ["deflate"] }
rars = { version = "=0.12.3", default-features = false }
sevenz-rust2 = { version = "=0.24.2", default-features = false, features = ["deflate", "ppmd", "bzip2"] }

[dev-dependencies]
sevenz-rust2 = { version = "=0.24.2", default-features = false, features = ["compress", "bzip2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
