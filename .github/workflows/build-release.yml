name: Build & Release (Windows)

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-win.lock

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-win.lock

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements-win.lock --strict

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify APP_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(awk -F\" '/APP_VERSION *=/ {print $2}' version.py)"
          test -n "$app_version"
          test "$tag_version" = "$app_version"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-win.lock

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-win.lock

      - name: Build executable
        run: pyinstaller --noconfirm --clean DIM-Creator.spec

      - name: Smoke-test executable
        run: .\dist\DIM-Creator.exe --smoke-test

      - name: Add documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md -Force
          Copy-Item LICENSE dist/LICENSE -Force

      - name: Generate SBOM
        run: python -m pip_audit -r requirements-win.lock --format cyclonedx-json --output dist/sbom.cdx.json

      - name: Package release ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $version = $version -replace '[^0-9A-Za-z._-]', '_'
          $archive = "dist/DIM-Creator_${version}_win-x64.zip"
          Compress-Archive -Path dist/DIM-Creator.exe,dist/README.md,dist/LICENSE,dist/sbom.cdx.json -DestinationPath $archive -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.json' } |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dim-creator-win-x64
          path: |
            dist/DIM-Creator.exe
            dist/DIM-Creator_*_win-x64.zip
            dist/sbom.cdx.json
            dist/SHA256SUMS.txt
            dist/README.md
            dist/LICENSE
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dim-creator-win-x64
          path: dist

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          notes="$(awk -v tag="$GITHUB_REF_NAME" '
            BEGIN { found=0 }
            /^[[:space:]]*##[[:space:]]+/ {
              if (found) exit
              if ($0 ~ ("^[[:space:]]*##[[:space:]]+" tag "([[:space:]]|$)")) found=1
            }
            found { print }
          ' CHANGELOG.md)"
          {
            echo 'notes<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: ${{ steps.changelog.outputs.notes == '' }}
          files: |
            dist/DIM-Creator.exe
            dist/DIM-Creator_*_win-x64.zip
            dist/sbom.cdx.json
            dist/SHA256SUMS.txt
