name: Release

on:
  push:
    tags: ["v3.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'H1ghSyst3m/DIM-Creator' && github.ref_type == 'tag' && github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag, main ancestry and versions
        id: metadata
        run: python3 -B .github/scripts/release.py validate

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dim-creator-windows-x64
          path: ${{ runner.temp }}/nsis
      - name: Create draft, verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 -B .github/scripts/release.py publish "$RUNNER_TEMP/nsis" "$RUNNER_TEMP/release"
