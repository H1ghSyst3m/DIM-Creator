name: CI

on:
  push:
    branches: [main, v3/rust-rework]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        type: string
        description: Verified commit for a tagged release build

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Test release validation and publication gates
        run: python3 -B -m unittest discover -s .github/scripts -v

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend assets
        run: npm run build
      - name: Prepare Rust stable for Windows x64
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Build Windows installer
        run: npm run tauri -- build --ci -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dim-creator-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
